apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-private-repo
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: github-private-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: REPLACE_WITH_REPOSITORY_URL
        username: REPLACE_WITH_REPOSITORY_USERNAME
        password: "{{ .github_pat }}"
  data:
    - secretKey: github_pat
      remoteRef:
        key: minikube-sandbox/github-pat
