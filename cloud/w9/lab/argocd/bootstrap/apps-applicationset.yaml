apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sandbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: "Sandbox project for demo applications"
  sourceRepos:
    - '*'
  destinations:
    - namespace: 'demo-*'
      server: https://kubernetes.default.svc
    - namespace: 'backend-*'
      server: https://kubernetes.default.svc
    - namespace: 'database-*'
      server: https://kubernetes.default.svc
    - namespace: 'frontend-*'
      server: https://kubernetes.default.svc
    - namespace: 'prometheus-*'
      server: https://kubernetes.default.svc
    - namespace: 'argo-rollout-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sandbox-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: REPLACE_WITH_REPOSITORY_URL
        revision: REPLACE_WITH_TARGET_REVISION
        directories:
          - path: argocd/apps/*/overlays/production
  template:
    metadata:
      name: '{{ printf "%s-%s" (index .path.segments 2) .path.basename | normalize }}'
    spec:
      project: sandbox
      source:
        repoURL: REPLACE_WITH_REPOSITORY_URL
        targetRevision: REPLACE_WITH_TARGET_REVISION
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'demo-{{ .path.basename }}'
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/preserveUnknownFields
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates[].apiVersion
            - .spec.volumeClaimTemplates[].kind
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
