apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-production
resources:
  - ../../base
patches:
  - path: service-nodeport.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
